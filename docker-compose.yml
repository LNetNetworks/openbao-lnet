services:
  openbao:
    build:
      context: .
      # Build args (OPENBAO_VERSION, ETHSIGN_REF) documented in docs/CONFIGURE.md
      args:
        OPENBAO_VERSION: ${OPENBAO_VERSION:-latest}
        # Fork con el endpoint sign-digest (rama feat/sign-digest, un solo commit
        # sobre el efdc481c… de upstream). Ver docs/CONFIGURE.md.
        ETHSIGN_REPO: ${ETHSIGN_REPO:-https://github.com/LNetNetworks/vault-plugin-secrets-ethsign.git}
        ETHSIGN_REF: ${ETHSIGN_REF:-236094bd56298a86364f397febd58644042256a8}
    image: openbao-lnet:latest
    container_name: openbao-lnet
    ports:
      - "8200:8200"
      - "8201:8201"   # Raft cluster port (required by integrated storage)
    cap_add:
      - IPC_LOCK
    environment:
      BAO_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./config/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
    command: server -config=/openbao/config/openbao.hcl

volumes:
  openbao-data:
